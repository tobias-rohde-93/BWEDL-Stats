name: Update Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        run: python -m pytest

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser security smoke
        env:
          BWEDL_BROWSER_TESTS: "1"
        run: python -m pytest tests/test_browser_security.py -q

      - name: Run live data update
        timeout-minutes: 20
        run: python update_data.py

      - name: Render update summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f update_report.json ]; then
            python -m pipeline.report --summary update_report.json >> "$GITHUB_STEP_SUMMARY" || echo "Update report is malformed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Update report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: update-failure-${{ github.run_id }}
          path: |
            update_report.json
            artifacts/**
          retention-days: 14
          if-no-files-found: warn

      - name: Commit and push generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- league_data.json league_data.js ranking_data.json ranking_data.js club_data.json club_data.js archive_data.js archive_tables.js data_status.json data_status.js calendar_index.json calendar_index.js calendar_state.json
          if [ -d calendars ] || git ls-files --error-unmatch -- calendars > /dev/null 2>&1; then
            git add -A -- calendars
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): publish validated update"
            git push
          fi

  notify:
    needs: update-data
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download current failure evidence
        if: ${{ needs.update-data.result == 'failure' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "update-failure-$GITHUB_RUN_ID" --dir notification-artifact

      - name: Evaluate scheduled update incident
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_UPDATE_RESULT: ${{ needs.update-data.result }}
          REPORT_PATH: notification-artifact/update_report.json
        run: python -m pipeline.github_incident notify
